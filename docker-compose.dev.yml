version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: personal-finance-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src-tauri/target
    ports:
      - "1420:1420"
      - "1421:1421"
    environment:
      - NODE_ENV=development
      - TAURI_DEV_HOST=0.0.0.0
    stdin_open: true
    tty: true
    command: npm run dev
